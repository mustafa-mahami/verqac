# Verqac on one server. Only 127.0.0.1 ports are published; the host Nginx handles TLS.
name: verqac

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      VERQAC_OWNER_PASSWORD: ${VERQAC_OWNER_PASSWORD}
      VERQAC_APP_PASSWORD: ${VERQAC_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      VERQAC_MIGRATION_DATABASE_URL: postgresql+psycopg://verqac_owner:${VERQAC_OWNER_PASSWORD}@db:5432/verqac
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      VERQAC_DATABASE_URL: postgresql+psycopg://verqac_app:${VERQAC_APP_PASSWORD}@db:5432/verqac
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports:
      - "127.0.0.1:8300:8000"

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8301:80"

volumes:
  pgdata:
