server {
    listen 80;
    root /usr/share/nginx/html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # single-page app: every other path serves index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
